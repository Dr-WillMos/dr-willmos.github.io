<p class="circle-footnote">文章摘自朋友们的 RSS，只收录最近两年发布的，定时更新，点击标题前往原文。</p>

<script>
(function () {
  var MONTHS = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  var MONTHS_EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var app = document.getElementById('circle-app');
  var activeFilter = '__all__';

  function timeAgo(iso) {
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return '刚刚';
    var min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' 小时前';
    var day = Math.floor(hr / 24);
    if (day < 30) return day + ' 天前';
    var mon = Math.floor(day / 30);
    return mon + ' 个月前';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function firstChar(name) {
    var s = String(name == null ? '' : name).trim();
    return (s.charAt(0) || '?').toUpperCase();
  }

  // 头像渲染：加载失败（onerror）或地址为空时，显示首字母彩色占位，避免破图
  function avatarHtml(avatar, name, imgCls, wrapCls) {
    var letter = firstChar(name);
    var fallback = !avatar;
    var img = fallback
      ? ''
      : '<img class="' + imgCls + '" src="' + esc(avatar) + '" alt="" onerror="this.onerror=null;this.remove();var p=this.parentNode;if(p){p.classList.add(\'is-fallback\');}">';
    return '<span class="circle-avatar-wrap ' + wrapCls + (fallback ? ' is-fallback' : '') + '" data-letter="' + esc(letter) + '">' + img + '</span>';
  }

  function render(data) {
    var friends = (data.friends || []).filter(function (f) { return f.count > 0; });
    var articles = data.articles || [];

    var stats =
      '<div class="circle-stats">' +
      '<div class="circle-stat-card"><div class="circle-stat-num">' + data.total_articles + '</div><div class="circle-stat-label">两年内文章</div></div>' +
      '<div class="circle-stat-card"><div class="circle-stat-num">' + data.total_friends + '</div><div class="circle-stat-label">位朋友</div></div>' +
      '<div class="circle-stat-card"><div class="circle-stat-num">' + timeAgo(data.generated) + '</div><div class="circle-stat-label">上次更新</div></div>' +
      '</div>';

    var filter = '<div class="circle-filters">';
    filter += '<button class="circle-chip' + (activeFilter === '__all__' ? ' active' : '') + '" data-filter="__all__">全部 <span class="circle-chip-count">' + articles.length + '</span></button>';
    friends.forEach(function (f) {
      filter += '<button class="circle-chip' + (activeFilter === f.name ? ' active' : '') + '" data-filter="' + esc(f.name) + '">' +
        avatarHtml(f.avatar, f.name, 'circle-chip-avatar', 'av-chip') + esc(f.name) +
        ' <span class="circle-chip-count">' + f.count + '</span></button>';
    });
    filter += '</div>';

    var list = activeFilter === '__all__' ? articles : articles.filter(function (a) { return a.author === activeFilter; });

    var groups = {};
    list.forEach(function (a) {
      var key = a.year + '-' + a.month;
      if (!groups[key]) groups[key] = { year: a.year, month: a.month, items: [] };
      groups[key].items.push(a);
    });
    var keys = Object.keys(groups).sort(function (x, y) { return y.localeCompare(x); });

    var body = '';
    if (keys.length === 0) {
      body = '<div class="circle-empty">暂无文章</div>';
    } else {
      keys.forEach(function (k) {
        var g = groups[k];
        body += '<div class="circle-month"><div class="circle-month-title">' + g.year + ' ' + MONTHS[g.month] + ' · ' + MONTHS_EN[g.month] + '</div>';
        g.items.forEach(function (a) {
          body +=
            '<a class="circle-article" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
            '<div class="circle-day">' + a.day + '</div>' +
            avatarHtml(a.avatar, a.author, 'circle-avatar', 'av-article') +
            '<div class="circle-article-main">' +
            '<div class="circle-article-title">' + esc(a.title) + '</div>' +
            '<div class="circle-article-author">' + esc(a.author) + '</div>' +
            '</div></a>';
        });
        body += '</div>';
      });
    }

    app.innerHTML = stats + filter + body;

    app.querySelectorAll('.circle-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeFilter = btn.getAttribute('data-filter');
        render(data);
      });
    });

    // 头像加载超时兜底：弱网下 4 秒没加载完就显示首字母，不傻等
    app.querySelectorAll('.circle-avatar-wrap img').forEach(function (img) {
      var wrap = img.parentNode;
      if (!wrap) return;
      if (img.complete) {
        if (!img.naturalWidth) { img.remove(); wrap.classList.add('is-fallback'); }
        return;
      }
      var timer = setTimeout(function () {
        if (wrap.classList.contains('is-fallback')) return;
        img.remove();
        wrap.classList.add('is-fallback');
      }, 4000);
      img.addEventListener('load', function () {
        clearTimeout(timer);
        if (!img.naturalWidth) { img.remove(); wrap.classList.add('is-fallback'); }
      });
      img.addEventListener('error', function () { clearTimeout(timer); });
    });
  }

  fetch('/circle/data.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function (e) {
      app.innerHTML = '<div class="circle-empty">加载失败：' + esc(e.message) + '</div>';
    });
})();
</script>
